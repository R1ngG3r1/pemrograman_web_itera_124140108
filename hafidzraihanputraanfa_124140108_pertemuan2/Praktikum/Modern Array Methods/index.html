<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Array Methods</title>
  </head>
  <body>
    <header>
      <h1>Modern Array Methods</h1>
      <p>
        Latihan: Buat fungsi untuk menghitung rata-rata dari array of objects
      </p>
    </header>
    <main>
      <hr />
      <div>
        <div>
          <div>
            <label for="field">Hitung rata-rata dari</label>
            <select id="field">
              <option value="nilai">nilai</option>
              <option value="umur">umur</option>
            </select>
          </div>
          <div>
            <label for="kelas">Kelas</label>
            <select id="kelas">
              <option value="all">Semua</option>
              <option value="RA">RA</option>
              <option value="RB">RB</option>
            </select>
          </div>
        </div>
        <p id="rataRata"></p>
      </div>
      <hr />
      <div>
        <h2>Data mahasiswa</h2>
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>Kelas</th>
              <th>Nilai</th>
              <th>Umur</th>
            </tr>
          </thead>
          <tbody id="tabel"></tbody>
        </table>
      </div>
      <hr />
      <div>
        <h2>Rata-rata per kelas</h2>
        <table>
          <thead>
            <tr>
              <th>Kelas</th>
              <th>Jumlah</th>
              <th>Rata-rata</th>
            </tr>
          </thead>
          <tbody id="grup"></tbody>
        </table>
      </div>
    </main>
    <footer>&copy; 2026 Hafidz Raihan Putra Anfa</footer>
    <script src="java.js"></script>
  </body>
</html>
